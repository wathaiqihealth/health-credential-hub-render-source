name: Publish Render image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the verified release
        uses: actions/checkout@v4
        with:
          ref: b26919f7e4bb4e5b0b24ec66fd910ea0a4d5f2d7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the verified image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/wathaiqihealth/health-credential-hub-render-source:b26919f
            ghcr.io/wathaiqihealth/health-credential-hub-render-source:latest
          labels: |
            org.opencontainers.image.revision=b26919f7e4bb4e5b0b24ec66fd910ea0a4d5f2d7
            org.opencontainers.image.source=https://github.com/wathaiqihealth/health-credential-hub-render-source

      - name: Allow Render to pull the image anonymously
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method PATCH
          /orgs/${{ github.repository_owner }}/packages/container/health-credential-hub-render-source
          -f visibility=public
